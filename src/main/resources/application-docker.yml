spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hiretrack}
    username: ${POSTGRES_USER:hiretrack}
    password: ${POSTGRES_PASSWORD:hiretrack}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration